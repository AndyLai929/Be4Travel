[project]
name = "Be4Travel"
description = "Perk suggestion app for travel plans — Miles, STPC, Tourism Voucher, Transfer Voucher"
lang = "en"

[ci]
command = "cd apps/api && source .venv/bin/activate && pytest && ruff check app/ tests/"
architecture_check = ""
frontend_dir = ""

[models]
default = ""

[workflow]
max_iterations = 3
pass_threshold = 7.0
auto_merge = true
branch_prefix = "agent"
trunk_branch = "main"

[native]
adversarial_model = "gpt-4.1"
adversarial_mechanism = "auto"
review_gate = "eng"
gate_full_review_min = 5
gate_summary_confirm_min = 3

[integrations.memverse]
enabled = false
domain_prefix = ""